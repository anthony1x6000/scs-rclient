packages:
  - '.'

# Explicitly load the security-pin hook (dot-prefixed names are not autoloaded).
pnpmfile: .pnpmfile.cjs

allowBuilds:
  esbuild: true

# GHSA-fc5q-39xc-vjpf: picomatch ReDoS through repeated extglobs. Every path into
# it is dev-only (vite -> fdir/tinyglobby globbing, plus the build tooling), so it
# never ships in the app, and the advisory's fix (4.0.8) is not published yet.
# Drop this entry as soon as 4.0.8 is available; Dependabot will propose it.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080
trustPolicyExclude:
  - semver
blockExoticSubdeps: true
# All five pinned packages are exempted together; keep in sync with
# package.json overrides and .pnpmfile.cjs.
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - postcss@8.5.26
  - nanoid@3.3.18
  - browserslist@4.28.8
  - source-map-js@1.2.2
