version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Only propose releases at least a week old: fresh publishes stay on the
    # registry for a while before they can land in this repo.
    cooldown:
      default-days: 7
    # main requires branches to be up to date, so keep the branch rebased
    # instead of waiting for a hand-written rebase comment.
    rebase-strategy: auto
    open-pull-requests-limit: 5
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
      day: "tuesday"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    open-pull-requests-limit: 5
    ignore:
      # GHSA-wrw7-89jp-8q8g / RUSTSEC-2024-0429: glib 0.20+ requires GTK4 / gtk-rs 0.20+ constrained by Tauri v2 (see tauri-apps/tauri#12048, fix in v3 #12563)
      - dependency-name: "glib"
      - dependency-name: "glib-sys"
      - dependency-name: "glib-macros"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    rebase-strategy: auto
    open-pull-requests-limit: 10
