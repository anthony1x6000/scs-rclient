name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  # contents: write is the merge itself. actions: write re-fires the
  # build/deploy workflows after it, because a GITHUB_TOKEN merge creates no push
  # event for them to trigger on.
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  review:
    # Security: Standard pull_request trigger with untrusted fork guard
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: AI Code Review Agent
    runs-on: ${{ vars.FORCE_CLOUD_RUNNERS == 'true' && 'ubuntu-latest' || ((github.actor == 'anthony1x6000' || github.event.pull_request.user.login == 'anthony1x6000') && 'self-hosted' || 'ubuntu-latest') }}
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Wait for Other PR Checks to Pass
        id: wait-checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A gate that cannot open must end red. Exiting green with the review
          # skipped reads as "ai reviewed and approved" on the checks list, which
          # is a false signal; red is honest that no review was produced.
          if node scripts/ai-code-review.mjs wait-checks; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
            echo "::error title=ai review skipped::other PR checks did not pass, so no ai review was produced. the failing checks are listed above; fix or re-run them, then re-run this workflow."
            exit 1
          fi

      - name: Extract and Filter Source Diff
        if: steps.wait-checks.outputs.passed == 'true'
        id: diff
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # Full history on purpose: `A...B` needs a merge base, and a depth-1
          # fetch grafts the base branch with no parents, so the lookup dies
          # with "fatal: no merge base" as soon as the base branch advances past
          # the commit the PR merge ref was built against. The checkout already
          # has full depth, so this only pulls the commits main gained.
          git fetch --no-tags origin "$BASE_REF"
          git diff origin/"$BASE_REF"...HEAD -- . \
            ':(exclude)*lock*' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)package-lock.json' \
            ':(exclude)**/pnpm-lock.yaml' \
            ':(exclude)**/package-lock.json' \
            ':(exclude)*Cargo.lock*' \
            ':(exclude)**/Cargo.lock*' \
            ':(exclude)dist/**' \
            ':(exclude)**/dist/**' \
            ':(exclude)dist-win/**' \
            ':(exclude)**/dist-win/**' \
            ':(exclude)dist-linux/**' \
            ':(exclude)**/dist-linux/**' \
            ':(exclude)target/**' \
            ':(exclude)**/target/**' \
            ':(exclude)build/**' \
            ':(exclude)**/build/**' \
            ':(exclude).turbo/**' \
            ':(exclude)**/.turbo/**' \
            ':(exclude)migrations/**' \
            ':(exclude)**/migrations/**' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.gif' \
            ':(exclude)*.svg' \
            ':(exclude)*.ico' \
            ':(exclude)*.webp' \
            ':(exclude)*.mp4' \
            ':(exclude)*.mp3' \
            ':(exclude)*.wav' \
            ':(exclude)*.pdf' \
            > /tmp/filtered_pr.diff

          if [ ! -s /tmp/filtered_pr.diff ]; then
            echo "has_diff=false" >> $GITHUB_OUTPUT
            echo "no source code diff found after filtering generated files and assets."
          else
            echo "has_diff=true" >> $GITHUB_OUTPUT
            LINE_COUNT=$(wc -l < /tmp/filtered_pr.diff)
            echo "filtered source diff contains $LINE_COUNT lines."
            echo "=== BEGIN FILTERED DIFF ==="
            cat /tmp/filtered_pr.diff
            echo "=== END FILTERED DIFF ==="
          fi

      - name: Post Comment When No Source Code Changes
        if: steps.wait-checks.outputs.passed == 'true' && steps.diff.outputs.has_diff == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            printf '## ai code review\n\nno source code changes detected after filtering generated files, lockfiles, and media assets.\n\nverdict: APPROVE\n' > /tmp/no_changes_comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/no_changes_comment.md
          fi

      - name: Prepare AI Review Payload
        if: steps.wait-checks.outputs.passed == 'true' && steps.diff.outputs.has_diff == 'true'
        env:
          MAX_TOKENS: 16384
        run: node scripts/ai-code-review.mjs prepare-payload

      - name: Call AI Code Review Agent
        if: steps.wait-checks.outputs.passed == 'true' && steps.diff.outputs.has_diff == 'true'
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_NIM_KEY }}
        run: |
          if [ -z "$NVIDIA_API_KEY" ]; then
            echo "::error::NVIDIA_NIM_KEY secret is not configured in repository secrets."
            exit 1
          fi

          CURL_EXIT=0
          HTTP_STATUS=$(curl -s -S -w "%{http_code}" --max-time 120 -o /tmp/ai_review_response.json \
            https://integrate.api.nvidia.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $NVIDIA_API_KEY" \
            --data-binary @/tmp/ai_review_payload.json) || CURL_EXIT=$?

          echo "NVIDIA NIM response HTTP status: $HTTP_STATUS (curl exit: $CURL_EXIT)"

          if [ "$CURL_EXIT" -ne 0 ] || [ "$HTTP_STATUS" -ne 200 ]; then
            echo "::warning::NVIDIA NIM API request failed (curl exit $CURL_EXIT, HTTP $HTTP_STATUS)."
            ERR_MSG="upstream NVIDIA NIM API request failed (HTTP $HTTP_STATUS, curl exit $CURL_EXIT)."
            if [ -s /tmp/ai_review_response.json ]; then
              ERR_MSG="$ERR_MSG response: $(cat /tmp/ai_review_response.json)"
            fi
            jq -n --arg msg "$ERR_MSG" '{error: {message: $msg}}' > /tmp/ai_review_response.json
          fi

      - name: Post PR Review Comment and Verdict
        if: steps.wait-checks.outputs.passed == 'true' && steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ai-code-review.mjs post-comment

      # Closes the loop: an APPROVE verdict merges the PR. `success()` means the
      # post-comment step exited 0, which now happens only on an explicit
      # "verdict: APPROVE"; REQUEST CHANGES or a review with no verdict fails
      # that step and skips this one. PRs whose filtered diff was empty never
      # reach it either: the reviewer never saw those files, and unreviewed is
      # not approved.
      #
      # GH_TOKEN is the dedicated agent PAT, not GITHUB_TOKEN, because a push
      # event produced by GITHUB_TOKEN creates no workflow runs. Merging with
      # GITHUB_TOKEN would therefore skip the per-app workflows that deploy on
      # push to staging/main while the PR still reported a successful merge.
      - name: Auto-Merge Approved PR
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # Never merge a commit this review did not cover: a push that landed
          # after the review started would otherwise ride in on the old verdict.
          if ! CURRENT_HEAD=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha); then
            echo "::error title=auto-merge unavailable::the api did not return pr #$PR_NUMBER."
            exit 1
          fi

          if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "::warning title=auto-merge skipped::pr head moved to $CURRENT_HEAD, past the reviewed $HEAD_SHA. that commit gets its own review, so the merge is left to it."
            exit 0
          fi

          # `gh pr checks --watch` cannot run in this job: it would watch this
          # run's own in-progress check until the timeout. wait-checks skips
          # ai review runs instead and exits non-zero if any sibling check on
          # this sha did not pass, so a re-run that went red still blocks.
          node scripts/ai-code-review.mjs wait-checks

          gh pr merge "$PR_NUMBER" --squash
          echo "merged pr #$PR_NUMBER on ai review verdict: APPROVE."

          # That merge used GITHUB_TOKEN, and a push event it produces creates no
          # workflow runs, so the build/deploy workflow that runs on push to
          # main would never fire and the merge would land unbuilt/undeployed.
          # workflow_dispatch is exempt from that suppression, so re-fire the
          # workflows whose path filters match this PR.
          if ! CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD"); then
            echo "::error title=deploy dispatch failed::pr merged, but the changed files could not be read, so the deploy was not re-fired. re-run them on $BASE_REF by hand."
            exit 1
          fi

          fire_deploy() {
            if grep -qE "$2" <<<"$CHANGED"; then
              echo "changes match $1; re-firing its deploy on $BASE_REF."
              gh workflow run "$1" --ref "$BASE_REF"
            fi
          }

          fire_deploy tauri-build.yml '.*'
