name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ai-code-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  # contents: write is the merge itself. actions: write re-fires the
  # build/deploy workflows after it, because a GITHUB_TOKEN merge creates no push
  # event for them to trigger on.
  contents: write
  pull-requests: write
  actions: write
  checks: read

jobs:
  review:
    # Security: Standard pull_request trigger with untrusted fork guard
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    name: AI Code Review Agent
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Sibling Failures
        id: check-failures
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: node scripts/ai-code-review.mjs check-failures

      - name: Extract and Filter Source Diff
        id: diff
        env:
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: |
          # Full history on purpose: `A...B` needs a merge base, and a depth-1
          # fetch grafts the base branch with no parents, so the lookup dies
          # with "fatal: no merge base" as soon as the base branch advances past
          # the commit the PR merge ref was built against. The checkout already
          # has full depth, so this only pulls the commits main gained.
          git fetch --no-tags origin "$BASE_REF"
          git diff origin/"$BASE_REF"...HEAD -- . \
            ':(exclude)*lock*' \
            ':(exclude)pnpm-lock.yaml' \
            ':(exclude)package-lock.json' \
            ':(exclude)**/pnpm-lock.yaml' \
            ':(exclude)**/package-lock.json' \
            ':(exclude)*Cargo.lock*' \
            ':(exclude)**/Cargo.lock*' \
            ':(exclude)dist/**' \
            ':(exclude)**/dist/**' \
            ':(exclude)dist-win/**' \
            ':(exclude)**/dist-win/**' \
            ':(exclude)dist-linux/**' \
            ':(exclude)**/dist-linux/**' \
            ':(exclude)target/**' \
            ':(exclude)**/target/**' \
            ':(exclude)build/**' \
            ':(exclude)**/build/**' \
            ':(exclude).turbo/**' \
            ':(exclude)**/.turbo/**' \
            ':(exclude)migrations/**' \
            ':(exclude)**/migrations/**' \
            ':(exclude)*.png' \
            ':(exclude)*.jpg' \
            ':(exclude)*.jpeg' \
            ':(exclude)*.gif' \
            ':(exclude)*.svg' \
            ':(exclude)*.ico' \
            ':(exclude)*.webp' \
            ':(exclude)*.mp4' \
            ':(exclude)*.mp3' \
            ':(exclude)*.wav' \
            ':(exclude)*.pdf' \
            > /tmp/filtered_pr.diff

          if [ ! -s /tmp/filtered_pr.diff ]; then
            echo "has_diff=false" >> $GITHUB_OUTPUT
            echo "no source code diff found after filtering generated files and assets."
          else
            echo "has_diff=true" >> $GITHUB_OUTPUT
            LINE_COUNT=$(wc -l < /tmp/filtered_pr.diff)
            echo "filtered source diff contains $LINE_COUNT lines."
            echo "=== BEGIN FILTERED DIFF ==="
            cat /tmp/filtered_pr.diff
            echo "=== END FILTERED DIFF ==="
          fi

      - name: Post Comment When No Source Code Changes
        if: steps.diff.outputs.has_diff == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            printf '## ai code review\n\nno source code changes detected after filtering generated files, lockfiles, and media assets.\n\nverdict: APPROVE\n' > /tmp/no_changes_comment.md
            gh pr comment "$PR_NUMBER" --body-file /tmp/no_changes_comment.md
          fi

      - name: Prepare AI Review Payload
        if: steps.diff.outputs.has_diff == 'true'
        env:
          MAX_TOKENS: 16384
        run: node scripts/ai-code-review.mjs prepare-payload

      # Two reviewers audit the same skill over the same diff, one call per
      # model, all concurrent: longcat-2.5-preview-free and deepseek-v4.1-flash,
      # both on the opencode go plan. The list, the endpoints, the secret each
      # model needs, any per-model completion budget, and the reasoning level
      # every reviewer runs at live in .github/ai-review-models.json; that level
      # is high, the step under the endpoint's own ceiling, so a reviewer reasons
      # harder than its default without spending its whole completion budget on
      # the trace. A model that returns no review text abstains, so an
      # unavailable endpoint cannot block a merge on its own.
      - name: Call AI Code Review Models
        if: steps.diff.outputs.has_diff == 'true'
        env:
          OCG_KEY: ${{ secrets.OCG_KEY }}
        run: node scripts/ai-code-review.mjs call

      # Exits non-zero unless at least one model returned an explicit
      # "verdict: APPROVE" and no model that produced a review objected. That
      # exit code is job success, which is what the merge step waits on. PRs
      # whose filtered diff was empty never reach it either: the reviewers never
      # saw those files, and unreviewed is not approved.
      - name: Post PR Review Comment and Verdict
        if: steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/ai-code-review.mjs post-comment

      # Closes the loop: an APPROVE verdict merges the PR. `success()` means the
      # post-comment step exited 0, which now happens only on an explicit
      # "verdict: APPROVE"; REQUEST CHANGES or a review with no verdict fails
      # that step and skips this one. PRs whose filtered diff was empty never
      # reach it either: the reviewer never saw those files, and unreviewed is
      # not approved.
      - name: Auto-Merge Approved PR
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          steps.diff.outputs.has_diff == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # Never merge a commit this review did not cover: a push that landed
          # after the review started would otherwise ride in on the old verdict.
          if ! CURRENT_HEAD=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .head.sha); then
            echo "::error title=auto-merge unavailable::the api did not return pr #$PR_NUMBER."
            exit 1
          fi

          if [ "$CURRENT_HEAD" != "$HEAD_SHA" ]; then
            echo "::warning title=auto-merge skipped::pr head moved to $CURRENT_HEAD, past the reviewed $HEAD_SHA. that commit gets its own review, so the merge is left to it."
            exit 0
          fi

          # Auto-merge only proceeds once security review approves and builds pass
          WAIT_FOR_SECURITY=true node scripts/ai-code-review.mjs wait-checks

          gh pr merge "$PR_NUMBER" --squash
          echo "merged pr #$PR_NUMBER on ai review verdict: APPROVE."

          if ! CHANGED=$(git diff --name-only "origin/$BASE_REF...HEAD"); then
            echo "::error title=deploy dispatch failed::pr merged, but the changed files could not be read, so the deploy was not re-fired. re-run them on $BASE_REF by hand."
            exit 1
          fi

          fire_deploy() {
            if grep -qE "$2" <<<"$CHANGED"; then
              echo "changes match $1; re-firing its deploy on $BASE_REF."
              gh workflow run "$1" --ref "$BASE_REF"
            fi
          }

          fire_deploy tauri-build.yml '.*'
