name: Tauri Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  audit-glib:
    name: Audit GLib Security (Exception) (RUSTSEC-2024-0429 Guard)
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify GLib API Usage
        run: |
          if grep -rn "VariantStrIter" src-tauri/; then
            echo "ERROR: Vulnerable GLib API (VariantStrIter) detected in src-tauri! See RUSTSEC-2024-0429."
            exit 1
          else
            echo "SUCCESS: No vulnerable GLib VariantStrIter API usage detected in codebase."
          fi

  audit-pnpm:
    name: Audit PNPM Security
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-rust: 'false'
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit NPM Dependencies
        run: pnpm audit

  test-webdav-e2e:
    name: Test WebDAV Operations (Copyparty)
    runs-on: ubuntu-latest
    needs: [audit-glib, audit-pnpm]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-rust: 'true'

      - name: Install Linux dependencies
        run: |
          sudo NEEDRESTART_MODE=a DEBIAN_FRONTEND=noninteractive apt-get update
          sudo NEEDRESTART_MODE=a DEBIAN_FRONTEND=noninteractive apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Copyparty
        run: pip install copyparty

      - name: Run WebDAV Copyparty Integration Tests
        run: bash scripts/test/test-webdav-copyparty.sh

  build-linux:
    name: Build Linux Application
    needs: [audit-glib, audit-pnpm]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - name: Install Linux dependencies
        run: |
          sudo NEEDRESTART_MODE=a DEBIAN_FRONTEND=noninteractive apt-get update
          sudo NEEDRESTART_MODE=a DEBIAN_FRONTEND=noninteractive apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2 webkit2gtk-driver xvfb rpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit NPM Dependencies
        run: pnpm audit

      - name: Build Standard Tauri App
        run: pnpm tauri build

      - name: Organize Linux Release Assets
        run: |
          mkdir -p dist-linux
          cp src-tauri/target/release/bundle/appimage/*.AppImage dist-linux/scs-rclient-linux.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb dist-linux/scs-rclient-linux.deb
          cp src-tauri/target/release/bundle/rpm/*.rpm dist-linux/scs-rclient-linux.rpm

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-build-linux
          path: |
            dist-linux/scs-rclient-linux.AppImage
            dist-linux/scs-rclient-linux.deb
            dist-linux/scs-rclient-linux.rpm
            src-tauri/target/release/scs-rclient
          if-no-files-found: error

  build-windows:
    name: Build Windows Application
    needs: [audit-glib, audit-pnpm]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit NPM Dependencies
        run: pnpm audit

      - name: Build Portable Windows App
        run: pnpm tauri build --no-bundle

      - name: Organize Portable Windows Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win | Out-Null
          Copy-Item -Path src-tauri/target/release/scs-rclient.exe -Destination dist-win/scs-rclient-win-portable.exe
          Compress-Archive -Path dist-win/scs-rclient-win-portable.exe -DestinationPath dist-win/scs-rclient-win-portable.zip -Force

      - name: Build NSIS Installer (currentUser)
        run: |
          node -e "const fs = require('fs'); const file = 'src-tauri/tauri.conf.json'; const config = JSON.parse(fs.readFileSync(file, 'utf8')); config.bundle.windows = config.bundle.windows || {}; config.bundle.windows.webviewInstallMode = { type: 'downloadBootstrapper' }; config.bundle.windows.nsis = { installMode: 'currentUser' }; fs.writeFileSync(file, JSON.stringify(config, null, 2), 'utf8');"
          pnpm tauri build --bundles nsis

      - name: Organize NSIS Installer Binary
        shell: pwsh
        run: |
          $nsisFile = Get-ChildItem -Path src-tauri/target/release/bundle/nsis/*setup.exe | Select-Object -First 1
          if ($nsisFile) {
            Copy-Item -Path $nsisFile.FullName -Destination dist-win/scs-rclient-win-installer.exe
          }

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: tauri-build-windows
          path: dist-win/
          if-no-files-found: error

  build-no-icon-win:
    name: Build Windows Application without icon
    needs: [audit-glib, audit-pnpm]
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit NPM Dependencies
        run: pnpm audit

      - name: Fetch Historic Icons from Commit
        shell: pwsh
        run: |
          git init temp-repo
          cd temp-repo
          git remote add origin https://github.com/anthony1x6000/scs-rclient.git
          git fetch --depth 1 origin 4865bca7eedb37fd41793a011b2b6d90d405f1b5
          git checkout FETCH_HEAD
          cd ..
          Copy-Item -Path temp-repo/src-tauri/icons/* -Destination src-tauri/icons/ -Force
          Remove-Item -Path temp-repo -Recurse -Force

      - name: Build Portable Windows Binary with Default Icons
        run: pnpm tauri build --no-bundle

      - name: Organize Default Icon Portable Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist-win-noicon | Out-Null
          Copy-Item -Path src-tauri/target/release/scs-rclient.exe -Destination dist-win-noicon/scs-rclient-win-noicon.exe -Force
          Compress-Archive -Path dist-win-noicon/scs-rclient-win-noicon.exe -DestinationPath dist-win-noicon/scs-rclient-win-noicon.zip -Force

      - name: Upload Windows Portable No-Icon Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-build-windows-no-icon
          path: |
            dist-win-noicon/scs-rclient-win-noicon.exe
            dist-win-noicon/scs-rclient-win-noicon.zip
          if-no-files-found: error

  flatpak:
    name: Build Flatpak & OSTree Repository
    runs-on: ubuntu-latest
    needs: build-linux
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download Linux build artifact
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-linux
          path: .

      - name: Make binary executable
        run: chmod +x src-tauri/target/release/scs-rclient

      - name: Setup Flathub Remote
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Initialize OSTree Repository
        run: |
          mkdir -p repo
          ostree init --mode=archive --repo=repo
          ostree config --repo=repo set "core.min-free-space-percent" "0"
          ostree config --repo=repo set "core.min-free-space-size" "0MB"

      - name: Build Flatpak Application & Export to Repository
        run: |
          flatpak-builder \
            --repo=repo \
            --force-clean \
            --disable-cache \
            --install-deps-from=flathub \
            --user \
            --arch=x86_64 \
            --default-branch=master \
            --disable-rofiles-fuse \
            build-dir \
            .github/flatpak/online.anthonyis.scs-rclient.yml

      - name: Update OSTree Static Repository & Deltas
        run: |
          flatpak build-update-repo \
            --title="scs-rclient" \
            --comment="GUI wrapper for rclone" \
            --description="Flatpak repository for scs-rclient desktop application" \
            --homepage="https://github.com/anthony1x6000/scs-rclient" \
            --generate-static-deltas \
            repo

      - name: Create Flatpak Bundle
        run: |
          flatpak build-bundle repo scs-rclient-linux.flatpak online.anthonyis.scs-rclient \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo
          cp scs-rclient-linux.flatpak scs-rclient.flatpak

      - name: Compress OSTree Repo
        run: |
          GZIP=-9 tar -czf repo.tar.gz repo

      - name: Upload Flatpak Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tauri-build-flatpak
          path: scs-rclient-linux.flatpak
          if-no-files-found: error

      - name: Upload OSTree Repository Archive
        uses: actions/upload-artifact@v7
        with:
          name: ostree-repo-x86_64
          path: repo.tar.gz
          if-no-files-found: error

  test-e2e-flatpak:
    name: Test E2E Flatpak (Bundle & Sandboxed Sidecar)
    # Runs on every PR/push — no `if:` gate by design.
    runs-on: ubuntu-latest
    needs: flatpak
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download Flatpak Bundle Artifact
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-flatpak

      - name: Test Standalone Bundle Install
        run: bash scripts/test/test-bundle-install.sh scs-rclient-linux.flatpak

  test-repo-install:
    name: Test OSTree Repository Install & Update
    runs-on: ubuntu-latest
    needs: flatpak
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trust Workspace Directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download OSTree Repository Archive
        uses: actions/download-artifact@v8
        with:
          name: ostree-repo-x86_64

      - name: Test OSTree Repository Install & Update
        run: bash scripts/test/test-repo-install.sh

  test-e2e-linux:
    name: Test E2E Linux (deb, AppImage, binary)
    # Runs on every PR/push — no `if:` gate by design.
    runs-on: ubuntu-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install E2E test dependencies
        run: |
          sudo NEEDRESTART_MODE=a DEBIAN_FRONTEND=noninteractive apt-get update
          sudo NEEDRESTART_MODE=a DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb libfuse2

      - name: Download Linux build artifact
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-linux
          path: .

      - name: Make test scripts executable
        run: chmod +x scripts/test/*.sh src-tauri/target/release/scs-rclient

      - name: E2E .deb install test
        run: bash scripts/test/test-e2e-deb.sh

      - name: E2E AppImage test
        run: bash scripts/test/test-e2e-appimage.sh

      - name: E2E standalone binary test
        run: bash scripts/test/test-e2e-linux-binary.sh

  test-e2e-rpm:
    name: Test E2E RPM (Fedora dnf install)
    # Runs on every PR/push — no `if:` gate by design.
    runs-on: ubuntu-latest
    needs: build-linux
    container:
      image: fedora:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux build artifact
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-linux
          path: .

      - name: Install RPM via dnf
        run: dnf install -y ./dist-linux/scs-rclient-linux.rpm

      - name: Verify package metadata
        run: |
          rpm -q scs-rclient
          rpm -ql scs-rclient

      - name: Remove RPM package
        run: |
          dnf remove -y scs-rclient
          test ! -e /usr/bin/scs-rclient

  test-e2e-windows:
    name: Test E2E Windows (NSIS, portable)
    # Runs on every PR/push — no `if:` gate by design.
    runs-on: windows-latest
    needs: [build-windows, build-no-icon-win]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-windows
          path: dist-win

      - name: Download Windows No-Icon artifact
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-windows-no-icon
          path: dist-win-noicon

      - name: Run Windows E2E tests
        shell: pwsh
        run: pwsh scripts/test/test-e2e-windows.ps1

  deploy-gh-pages:
    name: Deploy Flatpak Repository to gh-pages
    runs-on: ubuntu-latest
    needs: [flatpak, test-repo-install]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download OSTree Repository Archive
        uses: actions/download-artifact@v8
        with:
          name: ostree-repo-x86_64

      - name: Prepare GitHub Pages Static Site
        run: bash scripts/actions/prepare-pages.sh _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          keep_files: false
          user_name: 'Anthony'
          user_email: '33004321+anthony1x6000@users.noreply.github.com'

  publish-release:
    name: Publish Release Assets
    if: github.event_name == 'release'
    needs: [build-linux, build-windows, build-no-icon-win, flatpak, test-e2e-linux, test-e2e-rpm, test-e2e-flatpak, test-e2e-windows, test-repo-install, test-webdav-e2e]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-linux
          path: artifacts/linux

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-windows
          path: artifacts/win

      - name: Download Windows No-Icon Artifact
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-windows-no-icon
          path: artifacts/win-noicon

      - name: Download Flatpak Artifact
        uses: actions/download-artifact@v8
        with:
          name: tauri-build-flatpak
          path: artifacts/flatpak

      - name: Assemble Release Assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          RELEASE_ASSETS=(
            scs-rclient-linux.AppImage
            scs-rclient-linux.deb
            scs-rclient-linux.rpm
            scs-rclient-linux.flatpak
            scs-rclient-win-installer.exe
            scs-rclient-win-portable.zip
            scs-rclient-win-noicon.zip
          )

          missing=0
          for name in "${RELEASE_ASSETS[@]}"; do
            src="$(find artifacts -type f -name "$name" -print -quit)"
            if [[ -z "$src" ]]; then
              echo "::error::missing release asset: $name was not produced by any build job"
              missing=1
              continue
            fi
            cp "$src" "release-assets/$name"
            echo "staged release-assets/$name (from $src)"
          done
          [[ "$missing" -eq 0 ]] || exit 1
          ls -l release-assets

      - name: Upload Assets to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          find release-assets -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.flatpak" -o -name "*.deb" -o -name "*.rpm" -o -name "*.exe" -o -name "*.zip" \) -exec gh release upload ${{ github.event.release.tag_name }} --clobber {} \+

      - name: Append Checksums to Release Description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view ${{ github.event.release.tag_name }} --json body --jq .body > release_body.txt
          sed -i '/### SHA256 Checksums/,$d' release_body.txt
          echo -e "\n\n### SHA256 Checksums" >> release_body.txt
          echo "| File | SHA256 Hash |" >> release_body.txt
          echo "| --- | --- |" >> release_body.txt

          find release-assets -maxdepth 1 -type f \( -name "*.AppImage" -o -name "*.flatpak" -o -name "*.deb" -o -name "*.rpm" -o -name "*.exe" -o -name "*.zip" \) | sort | while read -r file; do
            filename=$(basename "$file")
            hash=$(sha256sum "$file" | awk '{print $1}')
            echo "| \`$filename\` | \`$hash\` |" >> release_body.txt
          done

          gh release edit ${{ github.event.release.tag_name }} --notes-file release_body.txt

  virustotal:
    name: VirusTotal Release Asset Scan
    if: github.event_name == 'release'
    needs: [publish-release]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - name: Scan Release Assets via VirusTotal
        uses: crazy-max/ghaction-virustotal@v5.0.0
        continue-on-error: true
        with:
          vt_api_key: ${{ secrets.VT_KEY }}
          update_release_body: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            scs-rclient-win-portable\.zip$
            scs-rclient-win-noicon\.zip$
            scs-rclient-win-installer\.exe$
          request_rate: 2