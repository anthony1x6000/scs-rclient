name: Sync Tauri npm Versions

# Keeps the npm @tauri-apps packages on the same major.minor as the Rust crates
# they talk to. `tauri build` hard-fails on a mismatch, and Dependabot cannot
# edit package.json from a Cargo pull request, so a Cargo-only Tauri or plugin
# bump would otherwise leave main unbuildable (that is exactly how #109 failed).
# This runs after such a bump lands and opens the npm half as its own PR, which
# the normal review gate then merges.
on:
  push:
    branches:
      - main
    paths:
      - "src-tauri/Cargo.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-npm-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Align npm @tauri-apps packages
    runs-on: ubuntu-slim
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-env
        with:
          install-rust: 'false'
          node-version: 22

      - name: Test the sync script
        run: node --test scripts/sync-tauri-npm.test.mjs

      - name: Align package.json with the crate versions
        run: node scripts/sync-tauri-npm.mjs

      - name: Refresh the lockfile and open the PR
        env:
          GH_TOKEN: ${{ secrets.SCREENSHOT_TOKEN }}
          TOKEN: ${{ secrets.SCREENSHOT_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json; then
            echo "npm @tauri-apps packages already match the crates; nothing to do."
            exit 0
          fi
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::SCREENSHOT_TOKEN is not configured; the npm alignment stays uncommitted."
            exit 0
          fi
          pnpm install --lockfile-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/tauri-npm-sync
          git add package.json pnpm-lock.yaml
          git commit -m "chore(deps): align @tauri-apps npm packages with the Rust crates"
          git push --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:chore/tauri-npm-sync
          existing="$(gh pr list --head chore/tauri-npm-sync --state open --json number --jq '.[0].number')"
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head chore/tauri-npm-sync \
              --title "chore(deps): align @tauri-apps npm packages with the Rust crates" \
              --body "The Rust crates moved to a new minor, so the npm \`@tauri-apps\` packages follow. \`tauri build\` requires them to match; this PR is generated by \`.github/workflows/sync-tauri-npm.yml\`."
          else
            echo "Updated the open sync PR #$existing."
          fi
