name: 'Setup Rclone Sidecar'
description: 'Extracts and stages the verified rclone binary as a Tauri sidecar executable'
author: 'Anthony Stevens'
branding:
  icon: 'download-cloud'
  color: 'purple'

inputs:
  version:
    description: 'Rclone version string (e.g. 1.74.3)'
    required: true
  archive-dir:
    description: 'Directory containing the verified downloaded archives'
    required: false
    default: 'verified-binaries'
  target-dir:
    description: 'Destination directory for the extracted sidecar'
    required: false
    default: 'src-tauri/binaries'
  target-os:
    description: 'Target operating system (auto, linux, windows)'
    required: false
    default: 'auto'

outputs:
  sidecar-path:
    description: 'Path to the staged sidecar executable'
    value: ${{ steps.extract-sidecar.outputs.sidecar-path }}
  sidecar-name:
    description: 'Filename of the staged sidecar executable'
    value: ${{ steps.extract-sidecar.outputs.sidecar-name }}
  runtime-name:
    description: >-
      Filename Tauri resolves at runtime. `bundle.externalBin` entries are reduced
      to their last path component with the target-triple suffix dropped, so the
      running app looks for `rclone-sidecar` (`rclone-sidecar.exe` on Windows)
      in its own directory. Use this name when staging the sidecar next to a
      distributable app binary.
    value: ${{ steps.extract-sidecar.outputs.runtime-name }}

runs:
  using: "composite"
  steps:
    - name: Extract and Stage Sidecar
      id: extract-sidecar
      shell: bash
      run: |
        TARGET_OS="${{ inputs.target-os }}"
        if [ "$TARGET_OS" = "auto" ]; then
          case "$RUNNER_OS" in
            Linux) TARGET_OS="linux" ;;
            Windows) TARGET_OS="windows" ;;
            macOS) TARGET_OS="macos" ;;
            *) TARGET_OS="linux" ;;
          esac
        fi

        TARGET_DIR="${{ inputs.target-dir }}"
        ARCHIVE_DIR="${{ inputs.archive-dir }}"
        VERSION="${{ inputs.version }}"
        # A real rclone binary is tens of megabytes; anything smaller means the
        # archive was truncated and we would otherwise ship a broken sidecar.
        MIN_SIDECAR_BYTES=1048576

        mkdir -p "$TARGET_DIR"

        if [ "$TARGET_OS" = "linux" ]; then
          ARCHIVE="$ARCHIVE_DIR/rclone-v${VERSION}-linux-amd64.zip"
          unzip -q -o "$ARCHIVE"
          SIDECAR_NAME="rclone-sidecar-x86_64-unknown-linux-gnu"
          RUNTIME_NAME="rclone-sidecar"
          cp "rclone-v${VERSION}-linux-amd64/rclone" "$TARGET_DIR/$SIDECAR_NAME"
          chmod +x "$TARGET_DIR/$SIDECAR_NAME"
        elif [ "$TARGET_OS" = "windows" ]; then
          ARCHIVE="$ARCHIVE_DIR/rclone-v${VERSION}-windows-amd64.zip"
          unzip -q -o "$ARCHIVE"
          SIDECAR_NAME="rclone-sidecar-x86_64-pc-windows-msvc.exe"
          RUNTIME_NAME="rclone-sidecar.exe"
          cp "rclone-v${VERSION}-windows-amd64/rclone.exe" "$TARGET_DIR/$SIDECAR_NAME"
        else
          echo "Unsupported target OS: $TARGET_OS" >&2
          exit 1
        fi

        # Fail closed on a placeholder/truncated binary before anything bundles it.
        STAGED="$TARGET_DIR/$SIDECAR_NAME"
        STAGED_BYTES="$(wc -c < "$STAGED" | tr -d '[:space:]')"
        echo "Staged $STAGED ($STAGED_BYTES bytes)"
        if [ "$STAGED_BYTES" -lt "$MIN_SIDECAR_BYTES" ]; then
          echo "::error::$STAGED is only $STAGED_BYTES bytes (< $MIN_SIDECAR_BYTES); the rclone archive was not extracted correctly" >&2
          exit 1
        fi

        # Prove the staged binary really runs and is the version we pinned.
        unset RCLONE_VERSION # avoid colliding with rclone's boolean --version flag
        REPORTED="$("$STAGED" version 2>/dev/null | head -n 1 || true)"
        echo "Staged sidecar reports: ${REPORTED:-<no output>}"
        case "$REPORTED" in
          *"rclone v${VERSION}"*) ;;
          *)
            echo "::error::$STAGED does not report rclone v${VERSION} (got '${REPORTED:-<no output>}')" >&2
            exit 1
            ;;
        esac

        echo "sidecar-name=$SIDECAR_NAME" >> "$GITHUB_OUTPUT"
        echo "sidecar-path=$STAGED" >> "$GITHUB_OUTPUT"
        echo "runtime-name=$RUNTIME_NAME" >> "$GITHUB_OUTPUT"
